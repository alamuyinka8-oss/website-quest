<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website Quest</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">WQ</span>
          <span>Website Quest</span>
        </div>
        <div class="status-pill" id="siteStatus">Site: example.com</div>
      </header>

      <main class="layout">
        <aside class="controls-panel">
          <div class="panel-title">Choose a website</div>

          <label class="field" for="siteUrl">
            <span>Website URL</span>
            <input id="siteUrl" type="text" value="https://example.com" placeholder="https://example.com" />
          </label>

          <div class="action-row">
            <button id="loadSiteBtn" type="button">Load site</button>
            <button id="startBtn" class="primary" type="button">Start game</button>
          </div>

          <div class="preset-list" aria-label="Preset websites">
            <button class="preset" data-url="https://example.com" type="button">Example</button>
            <button class="preset" data-url="https://news.ycombinator.com" type="button">Hacker News</button>
            <button class="preset" data-url="https://wikipedia.org" type="button">Wikipedia</button>
            <button class="preset" data-url="https://www.google.com" type="button">Google</button>
          </div>

          <p class="helper">
            Many websites block embedding. If that happens, the game still works with a fallback scene.
          </p>

          <div class="stats-grid">
            <div class="stat-box">
              <span>Score</span>
              <strong id="score">0</strong>
            </div>
            <div class="stat-box">
              <span>Best</span>
              <strong id="bestScore">0</strong>
            </div>
            <div class="stat-box">
              <span>Speed</span>
              <strong id="speedValue">1.0x</strong>
            </div>
          </div>

          <div class="legend">
            <h3>Controls</h3>
            <ul>
              <li>Jump: Space / ↑</li>
              <li>Slide: ↓</li>
              <li>Restart: R</li>
            </ul>
          </div>
        </aside>

        <section class="game-panel">
          <div class="scene-wrap">
            <iframe id="websiteFrame" title="Website scene" src="https://example.com"></iframe>
            <div class="site-overlay" id="siteOverlay">
              <span id="siteOverlayText">Loading website...</span>
            </div>
            <canvas id="gameCanvas" width="960" height="500" aria-label="Website Quest game canvas"></canvas>
          </div>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
